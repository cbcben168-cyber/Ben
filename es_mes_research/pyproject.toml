[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "es-mes-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pandas==2.3.3", "numpy==2.5.3", "exchange-calendars==4.13.1", "futu-api==10.11.7108"]
[project.optional-dependencies]
dev = ["pytest==8.4.2"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
